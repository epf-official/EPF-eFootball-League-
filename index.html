<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPF আয়নাঘর eFootball League</title>
<meta name="theme-color" content="#05070d">
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#05070d;--panel:#0b1120;--panel2:#101a33;--gold:#d9ae3c;--gold2:#f3d27a;--blue:#2a63ff;--ink:#f4ecd8;--mute:#8d97b0;--line:#1c2845;--win:#2fd18b;--loss:#ff5a6a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 'Hind Siliguri',sans-serif;min-height:100vh;padding-bottom:84px}
h1,h2,h3,.disp{font-family:'Anek Bangla',sans-serif;font-weight:800;line-height:1.15}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(5,7,13,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Anek Bangla';font-weight:800}
.brand i{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#05070d;font-style:normal;font-size:13px}
.brand span small{display:block;font:500 11px 'Hind Siliguri';color:var(--mute)}
nav.top{display:none;gap:4px}
nav a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:500;transition:.2s}
nav.top a:hover,nav a.on{color:var(--gold2);background:var(--panel2)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(8,12,24,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
nav.bottom a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;flex:1;align-items:center}
nav.bottom a.on{background:none;color:var(--gold2)}
nav.bottom a.on svg{filter:drop-shadow(0 0 6px rgba(243,210,122,.7))}
@media(min-width:800px){nav.top{display:flex}nav.bottom{display:none}body{padding-bottom:0}}
.hero{position:relative;overflow:hidden;padding:56px 0 48px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 70% 90% at 80% 0,rgba(42,99,255,.35),transparent 60%),repeating-linear-gradient(90deg,transparent 0 26px,rgba(217,174,60,.12) 26px 29px),var(--bg)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--bg))}
.hero .wrap{position:relative;z-index:1}
.epf{display:inline-block;padding:3px 12px;border:1px solid var(--gold);border-radius:99px;color:var(--gold2);font:700 13px 'Anek Bangla';letter-spacing:.08em;margin-bottom:14px}
.hero h1{font-size:clamp(46px,11vw,96px);background:linear-gradient(180deg,var(--gold2),var(--gold) 70%,#9b7414);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font:700 clamp(18px,4vw,28px) 'Anek Bangla';margin-top:6px}
.hero p{color:var(--mute);max-width:520px;margin-top:10px}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;font-weight:600;border:1px solid var(--gold);color:var(--gold2);transition:.2s;cursor:pointer;background:none;font-family:inherit;font-size:15px}
.btn.fill{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#05070d;border-color:transparent}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(217,174,60,.25)}
section{padding:30px 0}
.sh{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px;gap:10px}
.sh h2{font-size:24px;border-left:4px solid var(--gold);padding-left:10px}
.sh a{color:var(--blue);font-size:14px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{color:var(--mute);font-weight:500;text-align:center;padding:10px 6px;background:var(--panel2)}
td{text-align:center;padding:10px 6px;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:nth-child(-n+4) td:first-child{box-shadow:inset 3px 0 var(--gold)}
td b{color:var(--gold2)}
.cl{display:flex;align-items:center;gap:10px;font-weight:600}
.crest{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;font:800 13px 'Anek Bangla';color:var(--gold2);border:1px solid var(--line);flex:none;overflow:hidden}
.crest.big{width:56px;height:56px;font-size:22px}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.form i.W{background:var(--win)}.form i.L{background:var(--loss)}.form i.D{background:var(--gold)}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.fx .t{display:flex;align-items:center;gap:8px;font-weight:600}
.fx .t:last-child{justify-content:flex-end;text-align:right}
.sc{font:800 20px 'Anek Bangla';padding:4px 12px;border-radius:8px;background:var(--panel2);color:var(--gold2);white-space:nowrap}
.sc.pend{font-size:13px;color:var(--blue)}
.meta{color:var(--mute);font-size:12px;text-align:center;margin-top:6px}
.rd{margin:22px 0 10px;color:var(--gold2);font:700 16px 'Anek Bangla'}
.stack{display:grid;gap:10px}
details.card summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details.card summary::-webkit-details-marker{display:none}
.sq{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:14px}
.sq div{display:flex;justify-content:space-between;gap:8px}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.main{border-color:var(--gold);color:var(--gold2)}
.tag.cap{border-color:var(--blue);color:#8fb0ff}
.soc a{color:var(--blue);margin-left:8px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.news h3{font-size:18px}.news time{color:var(--mute);font-size:12px}.news p{margin-top:6px;color:#c9c3b2;white-space:pre-line}
.f{display:grid;gap:12px}.f h3{font-size:16px;color:var(--gold2);margin-top:6px}
.f label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.f input,.f select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;width:100%}
.f input:focus{outline:2px solid var(--gold)}
.msg{padding:10px;border-radius:10px;font-size:14px;margin-top:4px}
.msg:empty{display:none}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.logo{width:40px;height:auto;mix-blend-mode:lighten;display:block}
.hero-logo{width:104px;margin-bottom:14px;filter:drop-shadow(0 0 18px rgba(217,174,60,.35))}
.ar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs .btn{white-space:nowrap}.tabs .btn.on{background:var(--gold);color:#05070d}
.btn.sm{padding:7px 12px;font-size:13px}
footer{padding:30px 0 20px;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
a:focus-visible,summary:focus-visible,.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
</style>
</head>

function drawNav(cur){

  document.getElementById('navTop').innerHTML = NAV.map(n => link(n, cur===n[0])).join('') + link(USER ? ['dashboard','ড্যাশবোর্ড','user'] : ['login','লগইন','user'], cur==='dashboard' || cur==='login');

}

let S = {season:null, clubs:[], players:[], matches:[], news:[]};
let USER = null, MYCLUB = null;
async function load(){
  if (DEMO) { S = demoData(); return; }
  const se = await db.from('seasons').select('*').eq('is_active', true).limit(1);
  S.season = se.data && se.data[0];
  const mq = db.from('matches').select('*').order('round').order('played_at');
  if (S.season) mq.eq('season_id', S.season.id);
  const [cl, pl, ma, ne] = await Promise.all([
    db.from('clubs').select('*').order('name'),
    db.from('players_public').select('*'),
    mq,
    db.from('news').select('*').order('created_at', {ascending:false}).limit(20)
  ]);
  S.clubs = cl.data || []; S.players = pl.data || []; S.matches = ma.data || []; S.news = ne.data || [];
  const err = se.error || cl.error || ma.error;
  if (err) throw err;
}

const club = id => S.clubs.find(c => c.id === id);
const crest = (c, big) => !c ? '' : (c.logo_url
  ? `<img class="crest ${big?'big':''}" src="${esc(c.logo_url)}" alt="" loading="lazy">`
  : `<span class="crest ${big?'big':''}">${esc(c.name.trim().charAt(0))}</span>`);
const when = d => d ? new Date(d).toLocaleString('bn-BD', {timeZone:'Asia/Dhaka', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}) + ' (BST)' : 'সময় ঠিক হয়নি';

function standings(){
  const T = {};
  S.clubs.filter(c => c.status === 'approved').forEach(c => T[c.id] = {c, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, f:[]});
  S.matches.filter(m => m.status === 'approved').forEach(m => {
    const h = T[m.home_club], a = T[m.away_club];
    if (!h || !a) return;
    h.p++; a.p++; h.gf += m.home_score; h.ga += m.away_score; a.gf += m.away_score; a.ga += m.home_score;
    if (m.home_score > m.away_score){ h.w++; a.l++; h.pts += 3; h.f.push('W'); a.f.push('L'); }
    else if (m.home_score < m.away_score){ a.w++; h.l++; a.pts += 3; a.f.push('W'); h.f.push('L'); }
    else { h.d++; a.d++; h.pts++; a.pts++; h.f.push('D'); a.f.push('D'); }
  });
  return Object.values(T).sort((x,y) => y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf || x.c.name.localeCompare(y.c.name));
}
function tableHTML(rows){
  if (!rows.length) return '<div class="empty">এখনো কোনো অনুমোদিত ক্লাব নেই।</div>';
  return `<div class="tw"><table><thead><tr><th>#</th><th>ক্লাব</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>ফর্ম</th></tr></thead><tbody>` +
    rows.map((r,i) => `<tr><td>${i+1}</td><td><a class="cl" href="#/clubs">${crest(r.c)}${esc(r.c.name)}</a></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td><b>${r.pts}</b></td><td><div class="form">${r.f.slice(-5).map(x=>`<i class="${x}"></i>`).join('')}</div></td></tr>`).join('') +
    `</tbody></table></div>`;
}
function fxHTML(m){
  const h = club(m.home_club), a = club(m.away_club);

window.cmp = () => {
  const a = +document.getElementById('ca').value, b = +document.getElementById('cb').value;
  const T = standings(), x = T.find(r => r.c.id === a), y = T.find(r => r.c.id === b), out = document.getElementById('cmpOut');

  let wa = 0, wb = 0, dr = 0;
  S.matches.filter(m => m.status === 'approved' && ((m.home_club===a && m.away_club===b) || (m.home_club===b && m.away_club===a))).forEach(m => {
    const ga = m.home_club === a ? m.home_score : m.away_score, gb = m.home_club === a ? m.away_score : m.home_score;

async function uploadFile(bucket, uid, f) {
  const path = `${uid}/${Date.now()}-${f.name.replace(/[^\w.]/g, '_')}`;

window.regClub = async e => {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true; say('অপেক্ষা করো...', true);
  try {
    const r = await db.auth.signUp({email: val('em'), password: val('pw')});
    if (r.error) throw r.error;
    if (!r.data.session) throw new Error('ইমেইল কনফার্মেশন চালু আছে। Supabase-এ Confirm email বন্ধ করো, তারপর আবার চেষ্টা করো।');
    const uid = r.data.user.id;
    const f = document.getElementById('logo').files[0];
    const logo_url = f ? await uploadFile('club-logos', uid, f) : null;
    const name = val('cn');
    const slug = (name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36)).replace(/^-+/, '');
    const c = await db.from('clubs').insert({name, slug, logo_url, owner_name: val('on'), owner_id: uid, status: 'pending'}).select().single();
    if (c.error) throw c.error;
    const p = await db.from('players').insert({club_id: c.data.id, name: val('pn'), efootball_uid: val('uid'), device: val('dv'), whatsapp: val('wa'), owner_id: uid, role: 'main', is_captain: true, status: 'pending'});
    if (p.error) throw p.error;
    USER = r.data.user; location.hash = '#/dashboard';
  } catch (err) { say(err.message || 'সমস্যা হয়েছে', false); btn.disabled = false; }
  return false;
};

window.subScore = async (id, btn) => {
  const m = S.matches.find(x => x.id === id), mine = parseInt(val('g1-' + id), 10), opp = parseInt(val('g2-' + id), 10);
  if (isNaN(mine) || isNaN(opp) || mine < 0 || opp < 0) return alert('সঠিক স্কোর দাও।');
  btn.disabled = true;
  try {
    const f = document.getElementById('sh-' + id).files[0];
    const screenshot_url = f ? await uploadFile('match-shots', USER.id, f) : null;
    const home = m.home_club === MYCLUB.id;
    const r = await db.from('matches').update({home_score: home ? mine : opp, away_score: home ? opp : mine, status: 'pending', screenshot_url}).eq('id', id).select();
    if (r.error) throw r.error;
    if (!r.data.length) throw new Error('স্কোর পাঠানো যায়নি।');
    await load(); render();
  } catch (err) { alert(err.message); btn.disabled = false; }
};

VIEWS['admin-epf'] = async () => {

  if (!USER) return page('অ্যাডমিন লগইন', `<form class="f card" style="max-width:420px" onsubmit="return adminLogIn(event)">${inp('em','অ্যাডমিন ইমেইল','email','required')}${inp('pw','পাসওয়ার্ড','password','required')}<button class="btn fill" type="submit">লগইন</button><div class="msg" id="msg"></div></form>`);
  const chk = await db.rpc('is_admin');
  if (!chk.data) return page('অ্যাডমিন', noItem('এই অ্যাকাউন্ট অ্যাডমিন নয়।') + '<button class="btn" onclick="logOut()" style="margin-top:16px">লগআউট</button>');
  const tabs = [['clubs','ক্লাব'],['players','প্লেয়ার'],['scores','স্কোর'],['fixtures','ফিক্সচার'],['news','নিউজ'],['seasons','সিজন']];
  return page('অ্যাডমিন প্যানেল', `<div class="tabs">${tabs.map(([k,l]) => `<button class="btn sm" id="tab-${k}" onclick="adminTab('${k}')">${l}</button>`).join('')}<button class="btn sm" onclick="logOut()">লগআউট</button></div><div id="adBody"></div>`);
};
window.adminLogIn = async e => {
  e.preventDefault(); say('অপেক্ষা করো...', true);
  const r = await db.auth.signInWithPassword({email: val('em'), password: val('pw')});
  if (r.error) { say('ইমেইল বা পাসওয়ার্ড ভুল।', false); return false; }
  USER = r.data.user; render(); return false;
};
window.adminTab = async t => {
  AD.tab = t;
  document.querySelectorAll('.tabs .btn').forEach(b => b.classList.toggle('on', b.id === 'tab-' + t));
  const body = document.getElementById('adBody'); if (!body) return;
  body.innerHTML = noItem('লোড হচ্ছে...');
  try { body.innerHTML = await ADT[t](); } catch (err) { body.innerHTML = noItem(esc(err.message)); }
};
const adRefresh = async () => { await load(); adminTab(AD.tab); };

ADT.clubs = async () => {
  const [c, p] = await Promise.all([db.from('clubs').select('*').order('status', {ascending: false}).order('id'), db.from('players').select('*')]);
  if (c.error) throw c.error;
  return '<div class="stack">' + ((c.data || []).map(x => {
    const cap = (p.data || []).find(y => y.club_id === x.id && y.is_captain);
    return `<div class="card ar"><div class="cl">${crest(x)}<div><b>${esc(x.name)}</b><div class="meta" style="text-align:left">প্রেসিডেন্ট: ${esc(x.owner_name || '-')}${cap ? ` · ক্যাপ্টেন: ${esc(cap.name)} · UID: ${esc(cap.efootball_uid)} · ${esc(cap.device || '')} · WA: ${esc(cap.whatsapp || '')}` : ''}</div></div></div>
    <div class="acts"><span class="tag ${x.status === 'approved' ? 'main' : ''}">${x.status === 'approved' ? 'অনুমোদিত' : 'পেন্ডিং'}</span>${x.status !== 'approved' ? `<button class="btn fill sm" onclick="adAct('club','approve',${x.id})">অনুমোদন</button>` : ''}<button class="btn sm" onclick="adAct('club','del',${x.id})">মুছো</button></div></div>`;
  }).join('') || noItem('কোনো ক্লাব নেই।')) + '</div>';
};
ADT.players = async () => {
  const r = await db.from('players').select('*').order('status', {ascending: false}).order('id');
  if (r.error) throw r.error;
  return '<div class="stack">' + ((r.data || []).map(x => `<div class="card ar"><div><b>${esc(x.name)}</b> <span class="tag ${x.role === 'main' ? 'main' : ''}">${x.role === 'main' ? 'মেইন' : 'সাব'}</span><div class="meta" style="text-align:left">${x.club_id ? cname(x.club_id) : 'ফ্রি এজেন্ট'} · UID: ${esc(x.efootball_uid)} · ${esc(x.device || '')} · WA: ${esc(x.whatsapp || '')}</div></div>
    <div class="acts"><span class="tag ${x.status === 'approved' ? 'main' : ''}">${x.status === 'approved' ? 'অনুমোদিত' : 'পেন্ডিং'}</span>${x.status !== 'approved' ? `<button class="btn fill sm" onclick="adAct('player','approve',${x.id})">অনুমোদন</button>` : ''}<button class="btn sm" onclick="adAct('player','del',${x.id})">মুছো</button></div></div>`).join('') || noItem('কোনো প্লেয়ার নেই।')) + '</div>';
};
ADT.scores = async () => {
  const r = await db.from('matches').select('*').eq('status', 'pending').order('id');
  if (r.error) throw r.error;
  return '<div class="stack">' + ((r.data || []).map(m => `<div class="card"><div class="fx"><div class="t">${cname(m.home_club)}</div><div class="sc">${m.home_score} - ${m.away_score}</div><div class="t">${cname(m.away_club)}</div></div>
    <div class="acts" style="justify-content:center;margin-top:10px">${m.screenshot_url ? `<a href="${esc(m.screenshot_url)}" target="_blank" rel="noopener" style="color:var(--blue)">স্ক্রিনশট দেখো</a>` : '<span class="meta">স্ক্রিনশট নেই</span>'}<button class="btn fill sm" onclick="adAct('match','approve',${m.id})">অনুমোদন</button><button class="btn sm" onclick="adAct('match','reject',${m.id})">বাতিল</button></div></div>`).join('') || noItem('অনুমোদনের অপেক্ষায় কোনো স্কোর নেই।')) + '</div>';
};
ADT.fixtures = async () => {
  const n = S.matches.filter(m => m.status === 'scheduled').length;
  return `<div class="card f"><h3>ফিক্সচার তৈরি (সব অনুমোদিত ক্লাব একে অপরের সাথে)</h3>
    <div class="meta" style="text-align:left">সক্রিয় সিজন: ${esc(S.season ? S.season.name : 'নেই')} · অনুমোদিত ক্লাব: ${S.clubs.filter(c => c.status === 'approved').length} · বাকি ম্যাচ: ${n}</div>
    ${inp('fstart', 'প্রথম রাউন্ডের তারিখ ও সময় (বাংলাদেশ সময়)', 'datetime-local')}
    ${inp('fgap', 'প্রতি রাউন্ডের মাঝে কত দিন', 'number', 'value="7" min="1"')}
    <label style="display:flex;gap:8px;align-items:center;flex-direction:row"><input id="fdbl" type="checkbox" style="width:auto"> হোম ও অ্যাওয়ে (দুইবার)</label>
    <button class="btn fill" onclick="genFx()">ফিক্সচার তৈরি করো</button>
    <button class="btn" onclick="adAct('fixtures','clear',0)">খেলা হয়নি এমন সব ফিক্সচার মুছো</button></div>`;
};
ADT.news = async () => {
  const r = await db.from('news').select('*').order('created_at', {ascending: false});
  if (r.error) throw r.error;
  return `<div class="card f"><h3>নতুন নিউজ</h3>${inp('nt', 'শিরোনাম')}<label>বিস্তারিত<input id="nb" type="text"></label><button class="btn fill" onclick="addNews()">প্রকাশ করো</button></div><div class="stack" style="margin-top:12px">` +
    ((r.data || []).map(x => `<div class="card ar"><b>${esc(x.title)}</b><button class="btn sm" onclick="adAct('news','del',${x.id})">মুছো</button></div>`).join('')) + '</div>';
};
ADT.seasons = async () => {
  const r = await db.from('seasons').select('*').order('id', {ascending: false});
  if (r.error) throw r.error;
  return `<div class="card f"><h3>নতুন সিজন শুরু</h3>${inp('sn', 'সিজনের নাম')}<button class="btn fill" onclick="addSeason()">নতুন সিজন চালু করো</button></div><div class="stack" style="margin-top:12px">` +
    ((r.data || []).map(x => `<div class="card ar"><b>${esc(x.name)}</b><div class="acts">${x.is_active ? '<span class="tag main">সক্রিয়</span>' : `<button class="btn sm" onclick="adAct('season','activate',${x.id})">সক্রিয় করো</button>`}</div></div>`).join('')) + '</div>';
};

window.adAct = async (kind, act, id) => {
  let r;
  if (kind === 'club' && act === 'approve') {
    r = await db.from('clubs').update({status: 'approved'}).eq('id', id);
    if (!adOk(r)) return;
    r = await db.from('players').update({status: 'approved'}).eq('club_id', id).eq('is_captain', true);
  } else if (kind === 'club' && act === 'del') { if (!confirm('ক্লাব ও তার প্লেয়ার মুছে যাবে। নিশ্চিত?')) return; r = await db.from('clubs').delete().eq('id', id); }
  else if (kind === 'player' && act === 'approve') r = await db.from('players').update({status: 'approved'}).eq('id', id);
  else if (kind === 'player' && act === 'del') { if (!confirm('প্লেয়ার মুছবে?')) return; r = await db.from('players').delete().eq('id', id); }
  else if (kind === 'match' && act === 'approve') r = await db.from('matches').update({status: 'approved'}).eq('id', id);
  else if (kind === 'match' && act === 'reject') r = await db.from('matches').update({status: 'scheduled', home_score: null, away_score: null, screenshot_url: null}).eq('id', id);
  else if (kind === 'fixtures' && act === 'clear') { if (!confirm('খেলা হয়নি এমন সব ফিক্সচার মুছে যাবে। নিশ্চিত?')) return; r = await db.from('matches').delete().eq('status', 'scheduled'); }
  else if (kind === 'news' && act === 'del') r = await db.from('news').delete().eq('id', id);
  else if (kind === 'season' && act === 'activate') {
    r = await db.from('seasons').update({is_active: false}).eq('is_active', true);
    if (!adOk(r)) return;
    r = await db.from('seasons').update({is_active: true}).eq('id', id);
  }
  if (r && !adOk(r)) return;
  adRefresh();
};
window.addNews = async () => {
  const t = val('nt'); if (!t) return alert('শিরোনাম দাও।');
  if (adOk(await db.from('news').insert({title: t, body: val('nb')}))) adRefresh();
};
window.addSeason = async () => {
  const n = val('sn'); if (!n) return alert('সিজনের নাম দাও।');
  if (!adOk(await db.from('seasons').update({is_active: false}).eq('is_active', true))) return;
  if (adOk(await db.from('seasons').insert({name: n, is_active: true}))) adRefresh();
};
window.genFx = async () => {
  const cs = S.clubs.filter(c => c.status === 'approved');
  if (cs.length < 2) return alert('কমপক্ষে ২টা অনুমোদিত ক্লাব দরকার।');
  if (!S.season) return alert('আগে একটা সক্রিয় সিজন চালু করো।');
  if (S.matches.length && !confirm('এই সিজনে আগে থেকেই ম্যাচ আছে। তবুও নতুন ফিক্সচার যোগ করবে?')) return;
  const dbl = document.getElementById('fdbl').checked, start = document.getElementById('fstart').value, gap = parseInt(val('fgap'), 10) || 7;
  const ids = cs.map(c => c.id); if (ids.length % 2) ids.push(null);
  const n = ids.length; let arr = ids.slice(); const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) { const a = arr[i], b = arr[n - 1 - i]; if (a !== null && b !== null) pairs.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(pairs); arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
  }
  const all = dbl ? rounds.concat(rounds.map(rd => rd.map(([a, b]) => [b, a]))) : rounds;
  const base = start ? new Date(start + '+06:00') : null;
  const rows = [];
  all.forEach((rd, ri) => rd.forEach(([a, b]) => rows.push({season_id: S.season.id, round: ri + 1, home_club: a, away_club: b, status: 'scheduled', played_at: base ? new Date(base.getTime() + ri * gap * 864e5).toISOString() : null})));
  if (adOk(await db.from('matches').insert(rows))) { await load(); alert(rows.length + 'টা ম্যাচ তৈরি হয়েছে।'); adminTab('fixtures'); }
};

VIEWS.more = () => `<div class="wrap"><section><div class="sh"><h2>আরও</h2></div><div class="grid">` +
  [['register','ক্লাব রেজিস্ট্রেশন','club'],[USER?'dashboard':'login',USER?'ড্যাশবোর্ড':'ক্যাপ্টেন লগইন','user'],['players','প্লেয়ার','user'],['compare','ক্লাব তুলনা','vs'],['news','নিউজ','news'],['rules','নিয়মকানুন','rules']]
  .map(([p,l,i]) => `<a class="card" href="#/${p}" style="display:flex;align-items:center;gap:12px;color:var(--gold2)"><span style="width:24px;height:24px;display:inline-block">${svg(i).replace('<svg','<svg style="width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8"')}</span><b>${l}</b></a>`).join('') + `</div></section></div>`;

async function render(){
  const route = location.hash.replace(/^#\//, '') || '';
  drawNav(route in VIEWS ? route : '');
  window.scrollTo(0, 0);
  try {
    await ready;
    const banner = DEMO ? '<div class="wrap"><div class="meta" style="margin-top:10px;padding:6px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold2)">ডেমো মোড: নমুনা ডাটা দেখাচ্ছে। Supabase URL ও Key বসালে আসল ডাটা আসবে।</div></div>' : '';
    app.innerHTML = banner + await (VIEWS[route] || VIEWS[''])();
    if (route === 'compare') cmp();
    if (route === 'admin-epf' && document.getElementById('adBody')) adminTab(AD.tab);
  }
  catch (e) {
    console.error(e);
    app.innerHTML = '<div class="wrap"><section><div class="empty">ডাটা লোড হয়নি। index.html-এর উপরে Supabase URL ও Key ঠিক বসানো হয়েছে কিনা দেখো।</div></section></div>';
  }
}
const ready = load();
if (db) {
  db.auth.getSession().then(({data}) => { USER = data.session ? data.session.user : null; render(); });
  db.auth.onAuthStateChange((_e, sess) => { USER = sess ? sess.user : null; });
}
window.addEventListener('hashchange', render);
render();
</script>
