<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPF আয়নাঘর eFootball League</title>
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#05070d;--panel:#0b1120;--panel2:#101a33;--gold:#d9ae3c;--gold2:#f3d27a;--blue:#2a63ff;--ink:#f4ecd8;--mute:#8d97b0;--line:#1c2845;--win:#2fd18b;--loss:#ff5a6a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 'Hind Siliguri',sans-serif;min-height:100vh;padding-bottom:84px}
h1,h2,h3,.disp{font-family:'Anek Bangla',sans-serif;font-weight:800;line-height:1.15}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(5,7,13,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Anek Bangla';font-weight:800}
.brand i{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#05070d;font-style:normal;font-size:13px}
.brand span small{display:block;font:500 11px 'Hind Siliguri';color:var(--mute)}
nav.top{display:none;gap:4px}
nav a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:500;transition:.2s}
nav.top a:hover,nav a.on{color:var(--gold2);background:var(--panel2)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(8,12,24,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
nav.bottom a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;flex:1;align-items:center}
nav.bottom a.on{background:none;color:var(--gold2)}
nav.bottom a.on svg{filter:drop-shadow(0 0 6px rgba(243,210,122,.7))}
@media(min-width:800px){nav.top{display:flex}nav.bottom{display:none}body{padding-bottom:0}}
.hero{position:relative;overflow:hidden;padding:56px 0 48px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 70% 90% at 80% 0,rgba(42,99,255,.35),transparent 60%),repeating-linear-gradient(90deg,transparent 0 26px,rgba(217,174,60,.12) 26px 29px),var(--bg)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--bg))}
.hero .wrap{position:relative;z-index:1}
.epf{display:inline-block;padding:3px 12px;border:1px solid var(--gold);border-radius:99px;color:var(--gold2);font:700 13px 'Anek Bangla';letter-spacing:.08em;margin-bottom:14px}
.hero h1{font-size:clamp(46px,11vw,96px);background:linear-gradient(180deg,var(--gold2),var(--gold) 70%,#9b7414);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font:700 clamp(18px,4vw,28px) 'Anek Bangla';margin-top:6px}
.hero p{color:var(--mute);max-width:520px;margin-top:10px}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;font-weight:600;border:1px solid var(--gold);color:var(--gold2);transition:.2s;cursor:pointer;background:none;font-family:inherit;font-size:15px}
.btn.fill{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#05070d;border-color:transparent}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(217,174,60,.25)}
section{padding:30px 0}
.sh{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px;gap:10px}
.sh h2{font-size:24px;border-left:4px solid var(--gold);padding-left:10px}
.sh a{color:var(--blue);font-size:14px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{color:var(--mute);font-weight:500;text-align:center;padding:10px 6px;background:var(--panel2)}
td{text-align:center;padding:10px 6px;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:nth-child(-n+4) td:first-child{box-shadow:inset 3px 0 var(--gold)}
td b{color:var(--gold2)}
.cl{display:flex;align-items:center;gap:10px;font-weight:600}
.crest{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;font:800 13px 'Anek Bangla';color:var(--gold2);border:1px solid var(--line);flex:none;overflow:hidden}
.crest.big{width:56px;height:56px;font-size:22px}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.form i.W{background:var(--win)}.form i.L{background:var(--loss)}.form i.D{background:var(--gold)}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.fx .t{display:flex;align-items:center;gap:8px;font-weight:600}
.fx .t:last-child{justify-content:flex-end;text-align:right}
.sc{font:800 20px 'Anek Bangla';padding:4px 12px;border-radius:8px;background:var(--panel2);color:var(--gold2);white-space:nowrap}
.sc.pend{font-size:13px;color:var(--blue)}
.meta{color:var(--mute);font-size:12px;text-align:center;margin-top:6px}
.rd{margin:22px 0 10px;color:var(--gold2);font:700 16px 'Anek Bangla'}
.stack{display:grid;gap:10px}
details.card summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details.card summary::-webkit-details-marker{display:none}
.sq{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:14px}
.sq div{display:flex;justify-content:space-between;gap:8px}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.main{border-color:var(--gold);color:var(--gold2)}
.tag.cap{border-color:var(--blue);color:#8fb0ff}
.soc a{color:var(--blue);margin-left:8px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.news h3{font-size:18px}.news time{color:var(--mute);font-size:12px}.news p{margin-top:6px;color:#c9c3b2;white-space:pre-line}
.f{display:grid;gap:12px}.f h3{font-size:16px;color:var(--gold2);margin-top:6px}
.f label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.f input,.f select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;width:100%}
.f input:focus{outline:2px solid var(--gold)}
.msg{padding:10px;border-radius:10px;font-size:14px;margin-top:4px}
.msg:empty{display:none}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
footer{padding:30px 0 20px;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
a:focus-visible,summary:focus-visible,.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a href="#/" class="brand"><i>EPF</i><span>EPF আয়নাঘর<small>eFootball League : হারলেই সোজা ভেতরে</small></span></a>
  <nav class="top" id="navTop"></nav>
</div></header>
<main id="app"><div class="wrap"><div class="empty">লোড হচ্ছে...</div></div></main>
<footer><div class="wrap">© 2026 EPF আয়নাঘর eFootball League · হারলেই সোজা ভেতরে<br><a href="#/rules" style="color:var(--gold2)">নিয়মকানুন</a></div></footer>
<nav class="bottom" id="navBottom"></nav>

<script>
// ====== এই দুইটা জায়গায় নিজের Supabase তথ্য বসাও (Project Settings > API) ======
const SUPABASE_URL = 'PASTE_YOUR_PROJECT_URL';
const SUPABASE_KEY = 'PASTE_YOUR_ANON_PUBLIC_KEY';
// =================================================================================

const DEMO = typeof supabase === 'undefined' || SUPABASE_URL.startsWith('PASTE');
const db = DEMO ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
function demoData(){
  const c = (id, name) => ({id, name, slug:name, status:'approved', logo_url:null});
  const p = (id, club_id, name, role, cap) => ({id, club_id, name, role, is_captain:!!cap, facebook:'https://facebook.com', instagram:''});
  const d = n => new Date(Date.now() + n*864e5).toISOString();
  const m = (id, r, h, a, hs, as, st, n) => ({id, season_id:1, round:r, home_club:h, away_club:a, home_score:hs, away_score:as, status:st, played_at:d(n)});
  return {
    season:{id:1, name:'ডেমো সিজন'},
    clubs:[c(1,'গোল্ডেন ঈগলস'), c(2,'ব্লু ওয়ারিয়র্স'), c(3,'আয়নাঘর ওয়ালস'), c(4,'নাইট কিংস')],
    players:[p(1,1,'রাফি','main',1), p(2,1,'সাকিব','main'), p(3,1,'তানভীর','sub'), p(4,2,'নাঈম','main',1), p(5,2,'ইমন','main'), p(6,3,'ফাহিম','main',1), p(7,3,'রিয়াদ','main'), p(8,4,'অর্ক','main',1), p(9,4,'শাওন','main'), p(10,4,'মাহি','sub')],
    matches:[m(1,1,1,2,3,1,'approved',-6), m(2,1,3,4,2,2,'approved',-6), m(3,2,1,3,1,0,'approved',-2), m(4,2,2,4,0,0,'pending',-1), m(5,3,1,4,0,0,'scheduled',2), m(6,3,2,3,0,0,'scheduled',3)],
    news:[{id:1, title:'ডেমো নিউজ', body:'এটা শুধু নমুনা। Supabase যুক্ত করলে আসল ডাটা দেখাবে।', created_at:d(0)}]
  };
}
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  table:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  club:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5"/>'
};
Object.assign(ICON, {
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  vs:'<path d="M4 6h7M4 12h7M4 18h7M15 6l5 6-5 6"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  rules:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>'
});
const NAV = [['','হোম','home'],['standings','টেবিল','table'],['fixtures','ফিক্সচার','cal'],['clubs','ক্লাব','club'],['players','প্লেয়ার','user'],['compare','তুলনা','vs'],['news','নিউজ','news'],['rules','নিয়ম','rules']];
const MORE = ['players','compare','news','rules','more','register','login','dashboard'];
const svg = k => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
function drawNav(cur){
  const link = ([p,l,i], on) => `<a href="#/${p}" class="${on?'on':''}">${svg(i)}<span>${l}</span></a>`;
  document.getElementById('navTop').innerHTML = NAV.map(n => link(n, cur===n[0])).join('') + link(USER ? ['dashboard','ড্যাশবোর্ড','user'] : ['login','লগইন','user'], cur==='dashboard' || cur==='login');
  document.getElementById('navBottom').innerHTML = NAV.slice(0,4).map(n => link(n, cur===n[0])).join('') + link(['more','আরও','more'], MORE.includes(cur));
}

let S = {season:null, clubs:[], players:[], matches:[], news:[]};
let USER = null, MYCLUB = null;
async function load(){
  if (DEMO) { S = demoData(); return; }
  const se = await db.from('seasons').select('*').eq('is_active', true).limit(1);
  S.season = se.data && se.data[0];
  const mq = db.from('matches').select('*').order('round').order('played_at');
  if (S.season) mq.eq('season_id', S.season.id);
  const [cl, pl, ma, ne] = await Promise.all([
    db.from('clubs').select('*').order('name'),
    db.from('players_public').select('*'),
    mq,
    db.from('news').select('*').order('created_at', {ascending:false}).limit(20)
  ]);
  S.clubs = cl.data || []; S.players = pl.data || []; S.matches = ma.data || []; S.news = ne.data || [];
  const err = se.error || cl.error || ma.error;
  if (err) throw err;
}

const club = id => S.clubs.find(c => c.id === id);
const crest = (c, big) => !c ? '' : (c.logo_url
  ? `<img class="crest ${big?'big':''}" src="${esc(c.logo_url)}" alt="" loading="lazy">`
  : `<span class="crest ${big?'big':''}">${esc(c.name.trim().charAt(0))}</span>`);
const when = d => d ? new Date(d).toLocaleString('bn-BD', {timeZone:'Asia/Dhaka', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}) + ' (BST)' : 'সময় ঠিক হয়নি';

function standings(){
  const T = {};
  S.clubs.filter(c => c.status === 'approved').forEach(c => T[c.id] = {c, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, f:[]});
  S.matches.filter(m => m.status === 'approved').forEach(m => {
    const h = T[m.home_club], a = T[m.away_club];
    if (!h || !a) return;
    h.p++; a.p++; h.gf += m.home_score; h.ga += m.away_score; a.gf += m.away_score; a.ga += m.home_score;
    if (m.home_score > m.away_score){ h.w++; a.l++; h.pts += 3; h.f.push('W'); a.f.push('L'); }
    else if (m.home_score < m.away_score){ a.w++; h.l++; a.pts += 3; a.f.push('W'); h.f.push('L'); }
    else { h.d++; a.d++; h.pts++; a.pts++; h.f.push('D'); a.f.push('D'); }
  });
  return Object.values(T).sort((x,y) => y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf || x.c.name.localeCompare(y.c.name));
}
function tableHTML(rows){
  if (!rows.length) return '<div class="empty">এখনো কোনো অনুমোদিত ক্লাব নেই।</div>';
  return `<div class="tw"><table><thead><tr><th>#</th><th>ক্লাব</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>ফর্ম</th></tr></thead><tbody>` +
    rows.map((r,i) => `<tr><td>${i+1}</td><td><a class="cl" href="#/clubs">${crest(r.c)}${esc(r.c.name)}</a></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td><b>${r.pts}</b></td><td><div class="form">${r.f.slice(-5).map(x=>`<i class="${x}"></i>`).join('')}</div></td></tr>`).join('') +
    `</tbody></table></div>`;
}
function fxHTML(m){
  const h = club(m.home_club), a = club(m.away_club);
  if (!h || !a) return '';
  const mid = m.status === 'approved' ? `<div class="sc">${m.home_score} - ${m.away_score}</div>`
    : m.status === 'pending' ? `<div class="sc pend">অনুমোদনের অপেক্ষায়</div>` : `<div class="sc pend">VS</div>`;
  return `<div class="card"><div class="fx"><div class="t">${crest(h)}<span>${esc(h.name)}</span></div>${mid}<div class="t"><span>${esc(a.name)}</span>${crest(a)}</div></div><div class="meta">${m.status==='approved'?'শেষ':when(m.played_at)}</div></div>`;
}
const newsHTML = n => `<article class="card news"><time>${new Date(n.created_at).toLocaleDateString('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'long'})}</time><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></article>`;

const VIEWS = {
  '': () => {
    const up = S.matches.filter(m => m.status === 'scheduled').slice(0,4);
    const done = S.matches.filter(m => m.status === 'approved').slice(-3).reverse();
    return `<div class="hero"><div class="wrap"><span class="epf">EPF · ${esc(S.season?S.season.name:'নতুন সিজন')}</span>
      <h1>আয়নাঘর</h1><div class="sub">eFootball League : হারলেই সোজা ভেতরে</div>
      <p>২ জনের ক্লাব, ২ বনাম ২ কো-অপ লড়াই। জিতলে উপরে, হারলে সোজা ভেতরে।</p>
      <div class="cta"><a class="btn fill" href="#/standings">পয়েন্ট টেবিল</a><a class="btn" href="#/fixtures">ফিক্সচার</a><a class="btn" href="#/register">ক্লাব রেজিস্ট্রেশন</a></div></div></div>
    <div class="wrap"><section><div class="sh"><h2>পয়েন্ট টেবিল</h2><a href="#/standings">সব দেখো</a></div>${tableHTML(standings().slice(0,6))}</section>
    <section><div class="sh"><h2>আসন্ন ম্যাচ</h2><a href="#/fixtures">সব দেখো</a></div><div class="stack">${up.map(fxHTML).join('') || '<div class="empty">এখনো কোনো ফিক্সচার নেই।</div>'}</div></section>
    <section><div class="sh"><h2>সাম্প্রতিক ফলাফল</h2></div><div class="stack">${done.map(fxHTML).join('') || '<div class="empty">এখনো কোনো ফলাফল নেই।</div>'}</div></section></div>`;
  },
  standings: () => `<div class="wrap"><section><div class="sh"><h2>লিগ টেবিল</h2></div>${tableHTML(standings())}<p class="meta" style="text-align:left;margin-top:10px">জয় ৩, ড্র ১, হার ০ পয়েন্ট। শুধু অ্যাডমিন-অনুমোদিত ম্যাচ গোনা হয়। সোনালি দাগ = শীর্ষ ৪।</p></section></div>`,
  fixtures: () => {
    if (!S.matches.length) return `<div class="wrap"><section><div class="sh"><h2>ফিক্সচার ও ফলাফল</h2></div><div class="empty">এখনো কোনো ফিক্সচার তৈরি হয়নি।</div></section></div>`;
    const R = {}; S.matches.forEach(m => (R[m.round||0] = R[m.round||0] || []).push(m));
    return `<div class="wrap"><section><div class="sh"><h2>ফিক্সচার ও ফলাফল</h2></div>` +
      Object.keys(R).map(r => `<div class="rd">রাউন্ড ${r}</div><div class="stack">${R[r].map(fxHTML).join('')}</div>`).join('') + `</section></div>`;
  },
  clubs: () => `<div class="wrap"><section><div class="sh"><h2>ক্লাবসমূহ</h2></div><div class="stack">` +
    (S.clubs.filter(c => c.status === 'approved').map(c => {
      const sq = S.players.filter(p => p.club_id === c.id).sort((a,b) => (b.role==='main')-(a.role==='main'));
      return `<details class="card"><summary>${crest(c,true)}<div><h3>${esc(c.name)}</h3><div class="meta" style="text-align:left">${sq.length} জন প্লেয়ার</div></div></summary><div class="sq">` +
        (sq.map(p => `<div><span>${esc(p.name)} ${p.is_captain?'<span class="tag cap">ক্যাপ্টেন</span>':''}</span><span><span class="tag ${p.role==='main'?'main':''}">${p.role==='main'?'মেইন':'সাব'}</span><span class="soc">${p.facebook?`<a href="${esc(p.facebook)}" target="_blank" rel="noopener">FB</a>`:''}${p.instagram?`<a href="${esc(p.instagram)}" target="_blank" rel="noopener">IG</a>`:''}</span></span></div>`).join('') || '<div class="meta">স্কোয়াড এখনো যোগ হয়নি</div>') +
        `</div></details>`;
    }).join('') || '<div class="empty">এখনো কোনো ক্লাব অনুমোদিত হয়নি।</div>') + `</div></section></div>`,
  news: () => `<div class="wrap"><section><div class="sh"><h2>নিউজ</h2></div><div class="stack">${S.news.map(newsHTML).join('') || '<div class="empty">এখনো কোনো নিউজ নেই।</div>'}</div></section></div>`,
  rules: () => `<div class="wrap"><section><div class="sh"><h2>নিয়মকানুন</h2></div><div class="card"><p>এখানে লিগের নিয়ম লেখা হবে (পরের ধাপে অ্যাডমিন প্যানেল থেকে বদলানো যাবে)।</p></div></section></div>`
};

VIEWS.players = () => `<div class="wrap"><section><div class="sh"><h2>প্লেয়ার</h2></div><div class="grid">` +
  (S.players.map(p => { const c = club(p.club_id); return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="cl">${crest(c)}<span>${esc(p.name)}<br><small style="color:var(--mute);font-weight:400">${esc(c?c.name:'')}</small></span></span><span class="tag ${p.role==='main'?'main':''}">${p.role==='main'?'মেইন':'সাব'}</span></div>`; }).join('') || '<div class="empty">এখনো কোনো প্লেয়ার নেই।</div>') +
  `</div></section></div>`;

VIEWS.compare = () => {
  const o = sel => S.clubs.map((c,i) => `<option value="${c.id}" ${i===sel?'selected':''}>${esc(c.name)}</option>`).join('');
  const st = 'background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%';
  return `<div class="wrap"><section><div class="sh"><h2>ক্লাব তুলনা</h2></div><div class="card"><div class="fx" style="grid-template-columns:1fr auto 1fr"><select id="ca" style="${st}" onchange="cmp()">${o(0)}</select><b class="disp" style="color:var(--gold2)">VS</b><select id="cb" style="${st}" onchange="cmp()">${o(1)}</select></div><div id="cmpOut" style="margin-top:14px"></div></div></section></div>`;
};
window.cmp = () => {
  const a = +document.getElementById('ca').value, b = +document.getElementById('cb').value;
  const T = standings(), x = T.find(r => r.c.id === a), y = T.find(r => r.c.id === b), out = document.getElementById('cmpOut');
  if (!x || !y || a === b) { out.innerHTML = '<div class="meta">দুইটা আলাদা ক্লাব বেছে নাও।</div>'; return; }
  let wa = 0, wb = 0, dr = 0;
  S.matches.filter(m => m.status === 'approved' && ((m.home_club===a && m.away_club===b) || (m.home_club===b && m.away_club===a))).forEach(m => {
    const ga = m.home_club === a ? m.home_score : m.away_score, gb = m.home_club === a ? m.away_score : m.home_score;
    if (ga > gb) wa++; else if (ga < gb) wb++; else dr++;
  });
  const row = (l, u, v) => `<div class="fx" style="padding:8px 0;border-top:1px solid var(--line)"><b style="text-align:left">${u}</b><span class="meta" style="margin:0">${l}</span><b style="text-align:right">${v}</b></div>`;
  out.innerHTML = row('পয়েন্ট', x.pts, y.pts) + row('ম্যাচ', x.p, y.p) + row('জয়', x.w, y.w) + row('ড্র', x.d, y.d) + row('হার', x.l, y.l) +
    row('গোল দিয়েছে', x.gf, y.gf) + row('গোল খেয়েছে', x.ga, y.ga) + row('মুখোমুখি জয়', wa, wb) + `<div class="meta">মুখোমুখি ড্র: ${dr}</div>`;
};

// ================= রেজিস্ট্রেশন, লগইন, ক্যাপ্টেন ড্যাশবোর্ড =================
const page = (title, inner) => `<div class="wrap"><section><div class="sh"><h2>${title}</h2></div>${inner}</section></div>`;
const needKeys = '<div class="empty">এটা চালু করতে আগে index.html-এ Supabase URL ও Key বসাও।</div>';
const inp = (id, label, type = 'text', extra = '') => `<label>${label}<input id="${id}" type="${type}" ${extra}></label>`;
const say = (t, ok) => { const m = document.getElementById('msg'); if (!m) return; m.textContent = t; m.style.background = ok ? 'rgba(47,209,139,.15)' : 'rgba(255,90,106,.15)'; };
const val = id => document.getElementById(id).value.trim();
async function uploadFile(bucket, uid, f) {
  const path = `${uid}/${Date.now()}-${f.name.replace(/[^\w.]/g, '_')}`;
  const up = await db.storage.from(bucket).upload(path, f);
  if (up.error) throw up.error;
  return db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

VIEWS.register = () => DEMO ? page('ক্লাব রেজিস্ট্রেশন', needKeys) : page('ক্লাব রেজিস্ট্রেশন', `
<form class="f card" onsubmit="return regClub(event)">
  <h3>ক্লাবের তথ্য</h3>
  ${inp('cn','ক্লাবের নাম','text','required')}
  ${inp('on','ক্লাবের ওনার (প্রেসিডেন্ট) এর নাম','text','required')}
  ${inp('logo','ক্লাবের লোগো (গ্যালারি থেকে)','file','accept="image/*"')}
  <h3>ক্যাপ্টেনের তথ্য (ক্যাপ্টেন নিজেও প্লেয়ার)</h3>
  ${inp('pn','ক্যাপ্টেনের নাম','text','required')}
  ${inp('uid','eFootball গেম UID','text','required')}
  ${inp('dv','ডিভাইসের নাম','text','required')}
  ${inp('wa','WhatsApp নাম্বার','tel','required')}
  <h3>লগইনের তথ্য</h3>
  ${inp('em','ইমেইল','email','required')}
  ${inp('pw','পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)','password','required minlength="6"')}
  <button class="btn fill" type="submit">ক্লাব রেজিস্টার করো</button>
  <div class="msg" id="msg"></div>
  <p class="meta" style="text-align:left">রেজিস্ট্রেশনের পর অ্যাডমিন অ্যাপ্রুভ করলে ক্লাব সাইটে দেখা যাবে। আগে থেকে অ্যাকাউন্ট থাকলে <a href="#/login" style="color:var(--gold2)">লগইন করো</a>।</p>
</form>`);

window.regClub = async e => {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true; say('অপেক্ষা করো...', true);
  try {
    const r = await db.auth.signUp({email: val('em'), password: val('pw')});
    if (r.error) throw r.error;
    if (!r.data.session) throw new Error('ইমেইল কনফার্মেশন চালু আছে। Supabase-এ Confirm email বন্ধ করো, তারপর আবার চেষ্টা করো।');
    const uid = r.data.user.id;
    const f = document.getElementById('logo').files[0];
    const logo_url = f ? await uploadFile('club-logos', uid, f) : null;
    const name = val('cn');
    const slug = (name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36)).replace(/^-+/, '');
    const c = await db.from('clubs').insert({name, slug, logo_url, owner_name: val('on'), owner_id: uid, status: 'pending'}).select().single();
    if (c.error) throw c.error;
    const p = await db.from('players').insert({club_id: c.data.id, name: val('pn'), efootball_uid: val('uid'), device: val('dv'), whatsapp: val('wa'), owner_id: uid, role: 'main', is_captain: true, status: 'pending'});
    if (p.error) throw p.error;
    USER = r.data.user; location.hash = '#/dashboard';
  } catch (err) { say(err.message || 'সমস্যা হয়েছে', false); btn.disabled = false; }
  return false;
};

VIEWS.login = () => DEMO ? page('ক্যাপ্টেন লগইন', needKeys) : page('ক্যাপ্টেন লগইন', `
<form class="f card" style="max-width:420px" onsubmit="return logIn(event)">
  ${inp('em','ইমেইল','email','required')}
  ${inp('pw','পাসওয়ার্ড','password','required')}
  <button class="btn fill" type="submit">লগইন</button>
  <div class="msg" id="msg"></div>
  <p class="meta" style="text-align:left">ক্লাব নেই? <a href="#/register" style="color:var(--gold2)">ক্লাব রেজিস্টার করো</a></p>
</form>`);
window.logIn = async e => {
  e.preventDefault(); say('অপেক্ষা করো...', true);
  const r = await db.auth.signInWithPassword({email: val('em'), password: val('pw')});
  if (r.error) { say('ইমেইল বা পাসওয়ার্ড ভুল।', false); return false; }
  USER = r.data.user; location.hash = '#/dashboard';
  return false;
};
window.logOut = async () => { await db.auth.signOut(); USER = null; location.hash = '#/'; };

VIEWS.dashboard = async () => {
  if (DEMO) return page('ড্যাশবোর্ড', needKeys);
  if (!USER) { location.hash = '#/login'; return ''; }
  const [c, ps] = await Promise.all([
    db.from('clubs').select('*').eq('owner_id', USER.id).maybeSingle(),
    db.from('players').select('*').eq('owner_id', USER.id)
  ]);
  const my = c.data; MYCLUB = my;
  const out = '<button class="btn" onclick="logOut()" style="margin-top:20px">লগআউট</button>';
  if (!my) return page('ড্যাশবোর্ড', '<div class="empty">এই অ্যাকাউন্টে কোনো ক্লাব পাওয়া যায়নি।</div>' + out);
  const squad = S.players.filter(p => p.club_id === my.id);
  (ps.data || []).filter(p => p.club_id === my.id && !squad.some(x => x.id === p.id)).forEach(p => squad.push(p));
  const mm = S.matches.filter(m => m.home_club === my.id || m.away_club === my.id);
  const opp = m => club(m.home_club === my.id ? m.away_club : m.home_club);
  const todo = mm.filter(m => m.status === 'scheduled');
  const hist = mm.filter(m => m.status !== 'scheduled');
  const res = m => { const a = m.home_club === my.id ? m.home_score : m.away_score, b = m.home_club === my.id ? m.away_score : m.home_score; return {a, b, r: a > b ? 'W' : a < b ? 'L' : 'D'}; };
  return page('ক্লাব ড্যাশবোর্ড', `
  <div class="card" style="display:flex;gap:14px;align-items:center">${crest(my, true)}<div><h3>${esc(my.name)}</h3><div class="meta" style="text-align:left">প্রেসিডেন্ট: ${esc(my.owner_name || '-')}</div>
  <span class="tag ${my.status === 'approved' ? 'main' : ''}">${my.status === 'approved' ? 'অনুমোদিত' : 'অ্যাডমিন অ্যাপ্রুভালের অপেক্ষায়'}</span></div></div>
  <div class="rd">স্কোয়াড</div><div class="card"><div class="sq" style="border:0;margin:0;padding:0">${squad.map(p => `<div><span>${esc(p.name)} ${p.is_captain ? '<span class="tag cap">ক্যাপ্টেন</span>' : ''}</span><span class="tag ${p.role === 'main' ? 'main' : ''}">${p.role === 'main' ? 'মেইন' : 'সাব'}${p.status === 'pending' ? ' · পেন্ডিং' : ''}</span></div>`).join('') || '<div class="meta">কোনো প্লেয়ার নেই</div>'}</div></div>
  <div class="rd">স্কোর সাবমিট</div>
  <div class="stack">${my.status !== 'approved' ? '<div class="empty">ক্লাব অনুমোদন হলে স্কোর পাঠাতে পারবে।</div>' : todo.map(m => `<div class="card f"><div class="fx"><div class="t">${crest(my)}<span>${esc(my.name)}</span></div><b class="disp" style="color:var(--gold2)">VS</b><div class="t"><span>${esc(opp(m).name)}</span>${crest(opp(m))}</div></div>
    <div class="two">${inp('g1-' + m.id, 'আমাদের গোল', 'number', 'min="0" value="0"')}${inp('g2-' + m.id, 'প্রতিপক্ষের গোল', 'number', 'min="0" value="0"')}</div>
    ${inp('sh-' + m.id, 'স্ক্রিনশট (ঐচ্ছিক)', 'file', 'accept="image/*"')}
    <button class="btn fill" onclick="subScore(${m.id}, this)">স্কোর পাঠাও</button></div>`).join('') || '<div class="empty">জমা দেওয়ার মতো কোনো ম্যাচ নেই।</div>'}</div>
  <div class="rd">ম্যাচ ইতিহাস</div>
  <div class="stack">${hist.map(m => { const x = res(m); return `<div class="card fx"><div class="t">${esc(opp(m).name)}</div><div class="sc ${m.status === 'pending' ? 'pend' : ''}">${m.status === 'pending' ? 'অনুমোদনের অপেক্ষায়' : x.a + ' - ' + x.b}</div><div class="t" style="color:${x.r === 'W' ? 'var(--win)' : x.r === 'L' ? 'var(--loss)' : 'var(--gold)'}">${m.status === 'approved' ? (x.r === 'W' ? 'জয়' : x.r === 'L' ? 'হার' : 'ড্র') : ''}</div></div>`; }).join('') || '<div class="empty">এখনো কোনো ইতিহাস নেই।</div>'}</div>
  ${out}`);
};
window.subScore = async (id, btn) => {
  const m = S.matches.find(x => x.id === id), mine = parseInt(val('g1-' + id), 10), opp = parseInt(val('g2-' + id), 10);
  if (isNaN(mine) || isNaN(opp) || mine < 0 || opp < 0) return alert('সঠিক স্কোর দাও।');
  btn.disabled = true;
  try {
    const f = document.getElementById('sh-' + id).files[0];
    const screenshot_url = f ? await uploadFile('match-shots', USER.id, f) : null;
    const home = m.home_club === MYCLUB.id;
    const r = await db.from('matches').update({home_score: home ? mine : opp, away_score: home ? opp : mine, status: 'pending', screenshot_url}).eq('id', id).select();
    if (r.error) throw r.error;
    if (!r.data.length) throw new Error('স্কোর পাঠানো যায়নি।');
    await load(); render();
  } catch (err) { alert(err.message); btn.disabled = false; }
};

VIEWS.more = () => `<div class="wrap"><section><div class="sh"><h2>আরও</h2></div><div class="grid">` +
  [['register','ক্লাব রেজিস্ট্রেশন','club'],[USER?'dashboard':'login',USER?'ড্যাশবোর্ড':'ক্যাপ্টেন লগইন','user'],['players','প্লেয়ার','user'],['compare','ক্লাব তুলনা','vs'],['news','নিউজ','news'],['rules','নিয়মকানুন','rules']]
  .map(([p,l,i]) => `<a class="card" href="#/${p}" style="display:flex;align-items:center;gap:12px;color:var(--gold2)"><span style="width:24px;height:24px;display:inline-block">${svg(i).replace('<svg','<svg style="width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8"')}</span><b>${l}</b></a>`).join('') + `</div></section></div>`;

async function render(){
  const route = location.hash.replace(/^#\//, '') || '';
  drawNav(route in VIEWS ? route : '');
  window.scrollTo(0, 0);
  try {
    await ready;
    const banner = DEMO ? '<div class="wrap"><div class="meta" style="margin-top:10px;padding:6px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold2)">ডেমো মোড: নমুনা ডাটা দেখাচ্ছে। Supabase URL ও Key বসালে আসল ডাটা আসবে।</div></div>' : '';
    app.innerHTML = banner + await (VIEWS[route] || VIEWS[''])();
    if (route === 'compare') cmp();
  }
  catch (e) {
    console.error(e);
    app.innerHTML = '<div class="wrap"><section><div class="empty">ডাটা লোড হয়নি। index.html-এর উপরে Supabase URL ও Key ঠিক বসানো হয়েছে কিনা দেখো।</div></section></div>';
  }
}
const ready = load();
if (db) {
  db.auth.getSession().then(({data}) => { USER = data.session ? data.session.user : null; render(); });
  db.auth.onAuthStateChange((_e, sess) => { USER = sess ? sess.user : null; });
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
